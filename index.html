<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />

<title>WSAZ_777 | AI SYSTEM</title>

<!-- Fonts -->
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Orbitron:wght@500;600;700;800;900&display=swap" rel="stylesheet" />

<!-- Three.js CDN -->
<script src="https://cdn.jsdelivr.net/npm/three@0.152.2/build/three.min.js"></script>

<style>
:root {
  --green: #19e68c;
  --green2: #00ffc3;
  --white: #f2fff8;
  --muted: #91aa9b;
  --bg: #050b08;
  --panel: rgba(8, 20, 13, 0.91);
  --border: rgba(25, 230, 140, 0.22);
}
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}
body {
  min-height: 100vh;
  background: var(--bg);
  color: var(--white);
  font-family: Inter, Arial, sans-serif;
  overflow-x: hidden;
}
button,
input {
  font: inherit;
}
button {
  outline: none;
}
/* Background layers */
.background {
  position: fixed;
  inset: 0;
  z-index: -5;
  background: radial-gradient(ellipse at 15% 15%, #073c25, transparent 42%),
    radial-gradient(ellipse at 85% 85%, #06452b, transparent 38%),
    linear-gradient(135deg, #030906, #08150e 55%, #020805);
}
.background:before {
  content: "";
  position: absolute;
  inset: 0;
  opacity: 0.13;
  background-image: linear-gradient(
      rgba(25, 230, 140, 0.12) 1px,
      transparent 1px
    ),
    linear-gradient(90deg, rgba(25, 230, 140, 0.12) 1px, transparent 1px);
  background-size: 45px 45px;
}
.grain {
  position: fixed;
  inset: 0;
  z-index: -2;
  pointer-events: none;
  background: radial-gradient(ellipse at center, transparent 20%, rgba(0, 0, 0, 0.6));
}
.glow {
  position: fixed;
  width: 420px;
  height: 420px;
  border-radius: 50%;
  filter: blur(120px);
  opacity: 0.15;
  pointer-events: none;
  z-index: -1;
  background: var(--green);
  animation: floatGlow 9s ease-in-out infinite alternate;
}
.glow.one {
  top: -230px;
  left: -170px;
}
.glow.two {
  bottom: -230px;
  right: -170px;
  animation-delay: 2s;
}
@keyframes floatGlow {
  to {
    transform: translate(60px, 50px) scale(1.2);
    opacity: 0.23;
  }
}

/* Tela Boot com Three.js canvas */
.boot-screen {
  position: fixed;
  inset: 0;
  z-index: 99999;
  display: grid;
  place-items: center;
  overflow: hidden;
  background: radial-gradient(
    ellipse at center,
    #10291d 0%,
    #061109 48%,
    #020604 100%
  );
  transition: opacity 0.7s, visibility 0.7s;
  flex-direction: column;
  gap: 30px;
}
.boot-screen.hide {
  opacity: 0;
  visibility: hidden;
  pointer-events: none;
}
.boot-canvas-container {
  position: relative;
  width: 200px;
  height: 200px;
  filter: drop-shadow(0 0 15px #19e68c70);
  border-radius: 50%;
  border: 2px solid var(--green);
  box-shadow:
    0 0 30px var(--green),
    inset 0 0 15px var(--green2);
  background: #01120a;
}
/* Borda animada ao redor da foto */
.boot-photo-wrapper {
  position: relative;
  width: 110px;
  height: 110px;
  margin: 0 auto;
  border-radius: 50%;
  box-shadow:
    0 0 10px #00ffd1, 
    0 0 20px #00ffd1,
    inset 0 0 15px #19e68c;
  background: linear-gradient(45deg, #19e68c, #00ffc3);
  animation: borderGlow 2.5s linear infinite;
  overflow: visible;
}
.boot-photo-wrapper::before,
.boot-photo-wrapper::after {
  content: "";
  position: absolute;
  border-radius: 50%;
  border: 3px solid transparent;
  pointer-events: none;
}
.boot-photo-wrapper::before {
  top: -6px;
  left: -6px;
  right: -6px;
  bottom: -6px;
  border-top-color: #fff;
  border-right-color: #00ffc3;
  animation: borderRotate 4s linear infinite;
}
.boot-photo-wrapper::after {
  top: -12px;
  left: -12px;
  right: -12px;
  bottom: -12px;
  border-bottom-color: #19e68c;
  border-left-color: #ffffff90;
  animation: borderRotateReverse 5s linear infinite;
}
@keyframes borderGlow {
  0%, 100% {
    box-shadow:
      0 0 10px #00ffd1, 
      0 0 20px #00ffd1,
      inset 0 0 15px #19e68c;
  }
  50% {
    box-shadow:
      0 0 25px #00ffb3,
      0 0 35px #00ffb3,
      inset 0 0 22px #32ffb3;
  }
}
@keyframes borderRotate {
  to {
    transform: rotate(360deg);
  }
}
@keyframes borderRotateReverse {
  to {
    transform: rotate(-360deg);
  }
}
.boot-photo {
  width: 100px;
  height: 100px;
  object-fit: cover;
  border-radius: 50%;
  box-shadow: 0 0 10px #00ffc372;
  filter: drop-shadow(0 0 8px #00ffc3);
}

/* Títulos e descrições boot */
.boot-title {
  font-family: Orbitron, sans-serif;
  font-size: 30px;
  font-weight: 900;
  letter-spacing: 5px;
  text-align: center;
  color: var(--green);
  text-shadow: 0 0 13px #00ffc380;
}
.boot-title span {
  color: #fff2b5;
}
.boot-description {
  font-size: 12px;
  font-weight: 600;
  color: #98e5c0aa;
  letter-spacing: 1.5px;
  text-transform: uppercase;
  text-align: center;
}
.boot-loading {
  height: 4px;
  width: 250px;
  margin: 28px auto;
  background: rgba(255 255 255 / 0.2);
  border-radius: 14px;
  overflow: hidden;
  box-shadow: 0 0 18px #00ffc3bb inset;
  position: relative;
}
.boot-progress {
  height: 100%;
  width: 0%;
  background: linear-gradient(90deg, #8e2525, #d9a441, #00ffc3);
  box-shadow: 0 0 20px #d9a441;
  animation: progressAnim 3s ease forwards;
}
@keyframes progressAnim {
  to {
    width: 100%;
  }
}
.boot-status {
  color: #a9c5b3;
  font-size: 10px;
  letter-spacing: 2px;
  text-align: center;
  margin-top: -8px;
  font-family: Inter, sans-serif;
  user-select: none;
}

/* Botão entrar estilizado */
.boot-enter {
  margin: 15px auto 0;
  padding: 14px 48px;
  min-width: 190px;
  color: #040a04;
  font-family: Orbitron, sans-serif;
  font-size: 15px;
  font-weight: 900;
  letter-spacing: 3px;
  background: linear-gradient(120deg, #641b20, #a52c2c 48%, #542018);
  border: 2px solid #e5b957;
  border-radius: 18px;
  box-shadow: 0 0 18px #c43c3c45, inset 0 0 15px #e5b957a0;
  cursor: pointer;
  user-select: none;
  transition: all 0.3s ease;
}
.boot-enter:hover {
  filter: brightness(1.4);
  transform: translateY(-4px);
  box-shadow: 0 0 35px #e5b957cc, inset 0 0 20px #ffea72;
}

<!-- Tela boot com canvas threejs -->
<div class="boot-screen" id="bootScreen">
  <div class="boot-canvas-container">
    <canvas id="bootCanvas" width="200" height="200"></canvas>
  </div>
  <div class="boot-photo-wrapper">
    <img class="boot-photo" src="/file_000000009618820e9a50407df0e56103.png" alt="Foto do criador" />
  </div>
  <div class="boot-title">WSAZ_<span>777</span></div>
  <div class="boot-description">Neural intelligence system</div>
  <div class="boot-loading"><div class="boot-progress"></div></div>
  <div class="boot-status" id="bootStatus">CARREGANDO INTERFACE...</div>
  <button type="button" class="boot-enter" id="bootEnter">ENTRAR</button>
</div>

<!-- Fundo e brilhos -->
<div class="background"></div>
<div class="grain"></div>
<div class="glow one"></div>
<div class="glow two"></div>

<header>
  <div class="brand">
    <div class="crown">♛</div>
    <div>
      <div class="logo">WSAZ_777 IA <span>v5.3</span></div>
      <div class="subtitle">Inteligência Artificial · Sempre evoluindo</div>
    </div>
  </div>
  <div class="online">● ONLINE</div>
  <div class="quote">"Family don't end with blood."<small>— Dean Winchester</small></div>
</header>

<!-- Conteúdo principal etc... (o resto do seu HTML permanece intacto) -->

<script>
  // Animação do boot com Three.js
  const canvas = document.getElementById("bootCanvas");
  const renderer = new THREE.WebGLRenderer({ canvas, alpha: true, antialias: true });
  renderer.setSize(canvas.width, canvas.height);
  renderer.setClearColor(0x000000, 0); // transparente

  const scene = new THREE.Scene();

  const camera = new THREE.PerspectiveCamera(40, canvas.width / canvas.height, 0.1, 100);
  camera.position.z = 3;

  // Luz
  const ambientLight = new THREE.AmbientLight(0x00ffcc, 0.8);
  scene.add(ambientLight);
  const pointLight = new THREE.PointLight(0x00ffc3, 1);
  pointLight.position.set(2, 3, 3);
  scene.add(pointLight);

  // Modelo simplificado estilo "homem de ferro" - esfera metálica com glow e anéis
  const geometry = new THREE.SphereGeometry(0.8, 32, 32);

  const material = new THREE.MeshStandardMaterial({
    color: 0xd96242,
    metalness: 0.9,
    roughness: 0.15,
    emissive: 0x8a1a0f,
    emissiveIntensity: 0.3,
  });

  const ironManCore = new THREE.Mesh(geometry, material);
  scene.add(ironManCore);

  // Anéis 3D girando
  function createRing(radius, tube, color) {
    const ringGeometry = new THREE.TorusGeometry(radius, tube, 16, 100);
    const ringMaterial = new THREE.MeshBasicMaterial({ color, transparent: true, opacity: 0.5 });
    const ring = new THREE.Mesh(ringGeometry, ringMaterial);
    return ring;
  }

  const ring1 = createRing(1.05, 0.05, 0x00ffc3);
  scene.add(ring1);

  const ring2 = createRing(1.3, 0.03, 0x19e68c);
  ring2.rotation.x = Math.PI / 2;
  scene.add(ring2);

  const ring3 = createRing(0.75, 0.02, 0xd9a441);
  ring3.rotation.y = Math.PI / 2;
  scene.add(ring3);

  // Animação loop
  function animate() {
    requestAnimationFrame(animate);

    ironManCore.rotation.y += 0.01;
    ring1.rotation.z += 0.015;
    ring2.rotation.z -= 0.01;
    ring3.rotation.z += 0.005;

    renderer.render(scene, camera);
  }

  animate();

  // Load da boot screen com delay de 3 segundos
  const bootScreen = document.getElementById("bootScreen");
  const bootStatus = document.getElementById("bootStatus");
  const bootEnter = document.getElementById("bootEnter");
  const progressBar = document.querySelector(".boot-progress");

  const statusMessages = [
    "CARREGANDO INTERFACE...",
    "INICIALIZANDO SISTEMAS...",
    "ESTABELECENDO CONEXÃO...",
    "WSAZ_777 PRONTO."
  ];

  let idx = 0;
  const interval = setInterval(() => {
    idx++;
    if (idx < statusMessages.length) {
      bootStatus.textContent = statusMessages[idx];
    } else {
      clearInterval(interval);
    }
  }, 700);

  // Preenche barra de carregamento em 3s
  progressBar.style.animation = "progressAnim 3s ease forwards";

  setTimeout(() => {
    clearInterval(interval);
    bootStatus.textContent = "WSAZ_777 PRONTO.";
    bootEnter.style.display = "inline-block";
  }, 3000);

  bootEnter.addEventListener("click", () => {
    bootScreen.classList.add("hide");
    setTimeout(() => bootScreen.remove(), 800);
  });
</script>
