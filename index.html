<script>
"use strict";

const chat = document.getElementById("chat");
const input = document.getElementById("messageInput");
const imageInput = document.getElementById("imageInput");
const previewList = document.getElementById("previewList");
const typing = document.getElementById("typing");
const sendBtn = document.getElementById("sendBtn");
const conversationList = document.getElementById("conversationList");
const voiceModeBtn = document.getElementById("voiceModeBtn");

const STORAGE_KEY = "wsaz777_device_conversations_v1";
const ACTIVE_KEY = "wsaz777_device_active_conversation_v1";

let conversations = [];
let activeConversationId = null;
let selectedImages = [];
let busy = false;
let voiceMode = false;
let recognition = null;
let shouldSendVoiceText = false;

/* IDENTIFICADOR */
function makeId() {
  return window.crypto?.randomUUID
    ? crypto.randomUUID()
    : Date.now().toString(36) + Math.random().toString(36).slice(2);
}

/* INTRO */
function enterSite() {
  document.getElementById("intro").classList.add("hide");

  try {
    sessionStorage.setItem("wsazIntroSeen", "1");
  } catch (error) {}

  setTimeout(() => input.focus(), 400);
}

try {
  if (sessionStorage.getItem("wsazIntroSeen")) {
    document.getElementById("intro").classList.add("hide");
  }
} catch (error) {}

/* MENU MOBILE */
function toggleSidebar() {
  const sidebar = document.getElementById("sidebar");
  sidebar.classList.toggle("open");
}

function closeSidebar() {
  document.getElementById("sidebar").classList.remove("open");
}

function goToChat() {
  closeSidebar();
  document.getElementById("assistente").scrollIntoView({
    behavior: "smooth"
  });
  input.focus();
}

function focusInput() {
  goToChat();
}

/* GESTOS DE DESLIZAR */
let touchStartX = 0;
let touchStartY = 0;

document.addEventListener("touchstart", event => {
  if (!event.touches.length) return;

  touchStartX = event.touches[0].clientX;
  touchStartY = event.touches[0].clientY;
}, { passive: true });

document.addEventListener("touchend", event => {
  if (!event.changedTouches.length) return;

  const endX = event.changedTouches[0].clientX;
  const endY = event.changedTouches[0].clientY;

  const deltaX = endX - touchStartX;
  const deltaY = endY - touchStartY;

  if (Math.abs(deltaX) < 65) return;
  if (Math.abs(deltaX) < Math.abs(deltaY) * 1.3) return;

  const sidebar = document.getElementById("sidebar");

  if (deltaX < 0 && sidebar.classList.contains("open")) {
    closeSidebar();
  } else if (deltaX > 0 && !sidebar.classList.contains("open") && touchStartX < 45) {
    toggleSidebar();
  }
}, { passive: true });

/* CONVERSAS */
function getActiveConversation() {
  return conversations.find(c => c.id === activeConversationId) || null;
}

function saveConversations() {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(conversations));

    if (activeConversationId) {
      localStorage.setItem(ACTIVE_KEY, activeConversationId);
    } else {
      localStorage.removeItem(ACTIVE_KEY);
    }
  } catch (error) {
    console.error("Erro ao salvar conversas:", error);
    alert("O armazenamento do aparelho está cheio ou indisponível.");
  }
}

function createConversation() {
  const conversation = {
    id: makeId(),
    title: "Nova conversa",
    messages: [],
    updatedAt: Date.now()
  };

  conversations.unshift(conversation);
  activeConversationId = conversation.id;

  saveConversations();
  renderConversationList();
  renderConversation();

  input.focus();
}

function updateConversationTitle(conversation) {
  if (conversation.title !== "Nova conversa") return;

  const firstUserMessage = conversation.messages.find(
    message => message.role === "user"
  );

  if (!firstUserMessage) return;

  const title = firstUserMessage.content
    .replace(/\s+/g, " ")
    .trim();

  conversation.title = title.length > 34
    ? title.slice(0, 34) + "…"
    : title;
}

function renderConversationList() {
  conversationList.replaceChildren();

  if (!conversations.length) {
    const empty = document.createElement("div");
    empty.className = "history-empty";
    empty.textContent = "Nenhuma conversa salva.";
    conversationList.appendChild(empty);
    return;
  }

  conversations
    .slice()
    .sort((a, b) => b.updatedAt - a.updatedAt)
    .forEach(conversation => {
      const row = document.createElement("div");
      row.className = "conversation-item";

      const open = document.createElement("button");
      open.type = "button";
      open.className = "conversation-open";

      if (conversation.id === activeConversationId) {
        open.classList.add("selected");
      }

      open.textContent = "▤ " + conversation.title;
      open.title = conversation.title;
      open.onclick = () => openConversation(conversation.id);

      const remove = document.createElement("button");
      remove.type = "button";
      remove.className = "conversation-delete";
      remove.textContent = "×";
      remove.title = "Excluir conversa";
      remove.setAttribute("aria-label", "Excluir conversa");
      remove.onclick = () => deleteConversation(conversation.id);

      row.append(open, remove);
      conversationList.appendChild(row);
    });
}

function renderConversation() {
  chat.replaceChildren();

  const conversation = getActiveConversation();

  if (!conversation || !conversation.messages.length) {
    addMessage(
      "assistant",
      "Bem-vindo à WSAZ_777 IA!\n\nPosso ajudar com tecnologia, jogos, estudos, programação e muito mais.\n\nComo posso ajudar?"
    );
    return;
  }

  conversation.messages.forEach(message => {
    addMessage(
      message.role,
      message.content,
      message.images || []
    );
  });
}

function openConversation(id) {
  if (busy) return;

  activeConversationId = id;

  saveConversations();
  renderConversationList();
  renderConversation();
  closeSidebar();
}

function deleteConversation(id) {
  if (busy) return;

  if (!confirm("Deseja excluir esta conversa?")) return;

  conversations = conversations.filter(c => c.id !== id);

  if (activeConversationId === id) {
    activeConversationId = null;
  }

  if (!conversations.length) {
    createConversation();
    return;
  }

  if (!activeConversationId) {
    activeConversationId = conversations[0].id;
  }

  saveConversations();
  renderConversationList();
  renderConversation();
}

function newChat() {
  if (busy) return;

  stopSpeech();
  stopRecognition();

  selectedImages = [];
  renderPreviews();

  createConversation();
  closeSidebar();
}

function loadConversations() {
  try {
    const saved = localStorage.getItem(STORAGE_KEY);
    const parsed = saved ? JSON.parse(saved) : [];

    conversations = Array.isArray(parsed)
      ? parsed.filter(c =>
          c &&
          typeof c.id === "string" &&
          Array.isArray(c.messages)
        )
      : [];

    const savedActive = localStorage.getItem(ACTIVE_KEY);

    if (conversations.some(c => c.id === savedActive)) {
      activeConversationId = savedActive;
    } else if (conversations.length) {
      activeConversationId = conversations[0].id;
    } else {
      createConversation();
      return;
    }

    renderConversationList();
    renderConversation();

  } catch (error) {
    console.error("Erro ao carregar histórico:", error);
    conversations = [];
    createConversation();
  }
}

/* MENSAGENS */
function addMessage(role, text, images = []) {
  const wrapper = document.createElement("div");
  wrapper.className = `message ${role === "user" ? "user" : ""}`;

  const avatar = document.createElement("div");
  avatar.className = "avatar";
  avatar.textContent = role === "user" ? "U" : "♛";

  const bubble = document.createElement("div");
  bubble.className = "bubble";
  bubble.textContent = text;

  images.forEach(src => {
    const img = document.createElement("img");
    img.src = src;
    img.alt = "Imagem enviada";
    bubble.appendChild(img);
  });

  if (role === "assistant") {
    const actions = document.createElement("div");
    actions.className = "message-actions";

    const speak = document.createElement("button");
    speak.type = "button";
    speak.textContent = "🔊 Ouvir";
    speak.onclick = () => speakText(text);

    actions.appendChild(speak);
    bubble.appendChild(actions);
  }

  wrapper.append(avatar, bubble);
  chat.appendChild(wrapper);
  chat.scrollTop = chat.scrollHeight;
}

/* IMAGENS */
function renderPreviews() {
  previewList.replaceChildren();

  selectedImages.forEach((item, index) => {
    const box = document.createElement("div");
    box.className = "preview-item";

    const img = document.createElement("img");
    img.src = item.data;
    img.alt = "Prévia da imagem";

    const remove = document.createElement("button");
    remove.type = "button";
    remove.textContent = "×";
    remove.onclick = () => {
      selectedImages.splice(index, 1);
      renderPreviews();
    };

    box.append(img, remove);
    previewList.appendChild(box);
  });
}

function resizeImage(file) {
  return new Promise((resolve, reject) => {
    if (!file.type.match(/^image\/(jpeg|png|webp)$/)) {
      reject(new Error("Formato de imagem não suportado."));
      return;
    }

    const reader = new FileReader();

    reader.onload = () => {
      const img = new Image();

      img.onload = () => {
        const max = 1400;
        const ratio = Math.min(
          1,
          max / Math.max(img.width, img.height)
        );

        const canvas = document.createElement("canvas");
        canvas.width = Math.round(img.width * ratio);
        canvas.height = Math.round(img.height * ratio);

        const ctx = canvas.getContext("2d");

        if (!ctx) {
          reject(new Error("Não foi possível processar a imagem."));
          return;
        }

        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
        resolve(canvas.toDataURL("image/jpeg", 0.72));
      };

      img.onerror = () => reject(new Error("Não foi possível ler a imagem."));
      img.src = reader.result;
    };

    reader.onerror = () => reject(new Error("Falha ao carregar imagem."));
    reader.readAsDataURL(file);
  });
}

imageInput.addEventListener("change", async event => {
  const files = Array.from(event.target.files || []);
  const available = 5 - selectedImages.length;

  if (files.length > available) {
    alert(`Você ainda pode selecionar ${available} imagem(ns).`);
  }

  for (const file of files.slice(0, available)) {
    try {
      const data = await resizeImage(file);
      selectedImages.push({ data });
    } catch (error) {
      alert(error.message);
    }
  }

  renderPreviews();
  imageInput.value = "";
});

/* ENVIO PARA A IA */
async function sendMessage() {
  if (busy) return;

  const message = input.value.trim();

  if (!message && selectedImages.length === 0) return;

  let conversation = getActiveConversation();

  if (!conversation) {
    createConversation();
    conversation = getActiveConversation();
  }

  const images = selectedImages.map(item => item.data);
  const userContent = message || "Analise estas imagens.";

  const previousHistory = conversation.messages
    .slice(-12)
    .map(m => ({
      role: m.role,
      content: m.content
    }));

  conversation.messages.push({
    role: "user",
    content: userContent,
    images
  });

  updateConversationTitle(conversation);
  conversation.updatedAt = Date.now();

  addMessage("user", userContent, images);

  input.value = "";
  selectedImages = [];
  renderPreviews();

  saveConversations();
  renderConversationList();

  busy = true;
  sendBtn.disabled = true;
  typing.style.display = "block";

  try {
    const response = await fetch("/api/chat", {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        message: message || "Analise cuidadosamente as imagens enviadas. Descreva o que aparece nelas e responda à solicitação.",
        images,
        history: previousHistory,
        responseStyle: document.getElementById("responseStyle").value
      })
    });

    let data;

    try {
      data = await response.json();
    } catch {
      throw new Error("O servidor retornou uma resposta inválida.");
    }

    if (!response.ok) {
      throw new Error(
        data.reply || data.error || "Falha ao consultar o servidor."
      );
    }

    const answer = data.reply || "Não foi possível obter uma resposta.";

    conversation.messages.push({
      role: "assistant",
      content: answer
    });

    conversation.messages = conversation.messages.slice(-40);
    conversation.updatedAt = Date.now();

    addMessage("assistant", answer);

    saveConversations();
    renderConversationList();

    if (voiceMode) {
      speakText(answer);
    }

  } catch (error) {
    console.error("Erro ao enviar mensagem:", error);

    const lastMessage = conversation.messages[conversation.messages.length - 1];

    if (lastMessage && lastMessage.role === "user") {
      conversation.messages.pop();
    }

    saveConversations();

    addMessage(
      "assistant",
      error.message || "Não consegui conectar ao servidor. Tente novamente."
    );

  } finally {
    busy = false;
    sendBtn.disabled = false;
    typing.style.display = "none";
    input.focus();
  }
}

input.addEventListener("keydown", event => {
  if (event.key === "Enter" && !event.shiftKey) {
    event.preventDefault();
    sendMessage();
  }
});

/* MODO DE VOZ */
function toggleVoiceMode() {
  voiceMode = !voiceMode;

  voiceModeBtn.classList.toggle("enabled", voiceMode);
  voiceModeBtn.textContent = voiceMode
    ? "◉ VOZ ATIVADA"
    : "◉ VOZ DESATIVADA";

  if (!voiceMode) {
    stopSpeech();
    stopRecognition();
  }
}

/* RECONHECIMENTO DE VOZ */
function startVoice() {
  const Recognition =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;

  if (!Recognition) {
    alert("Seu navegador não oferece reconhecimento de voz. Tente usar o Chrome atualizado.");
    return;
  }

  if (recognition) {
    stopRecognition();
    return;
  }

  shouldSendVoiceText = true;
  recognition = new Recognition();

  recognition.lang = "pt-BR";
  recognition.interimResults = true;
  recognition.continuous = false;
  recognition.maxAlternatives = 1;

  let finalTranscript = "";

  recognition.onresult = event => {
    let interim = "";

    for (let i = event.resultIndex; i < event.results.length; i++) {
      const transcript = event.results[i][0].transcript;

      if (event.results[i].isFinal) {
        finalTranscript += transcript + " ";
      } else {
        interim += transcript;
      }
    }

    input.value = (finalTranscript + interim).trim();
  };

  recognition.onerror = event => {
    console.warn("Reconhecimento de voz:", event.error);

    if (event.error === "not-allowed") {
      shouldSendVoiceText = false;
      alert("Permita o acesso ao microfone nas configurações do navegador.");
    }
  };

  recognition.onend = () => {
    recognition = null;
    input.value = input.value.trim();

    const shouldSend = shouldSendVoiceText;
    shouldSendVoiceText = false;

    if (shouldSend && input.value) {
      sendMessage();
    }
  };

  try {
    recognition.start();
  } catch (error) {
    recognition = null;
    shouldSendVoiceText = false;
    alert("Não foi possível iniciar o microfone. Tente novamente.");
  }
}

function stopRecognition() {
  shouldSendVoiceText = false;

  if (recognition) {
    try {
      recognition.stop();
    } catch (error) {}

    recognition = null;
  }
}

/* SÍNTESE DE VOZ */
function stopSpeech() {
  if ("speechSynthesis" in window) {
    speechSynthesis.cancel();
  }
}

function speakText(text) {
  if (!("speechSynthesis" in window)) {
    alert("Leitura de voz não disponível neste navegador.");
    return;
  }

  stopSpeech();

  const cleanText = String(text)
    .replace(/```[\s\S]*?```/g, "Código omitido.")
    .replace(/https?:\/\/\S+/g, "link")
    .replace(/[*_#>`~]/g, "")
    .trim();

  const utterance = new SpeechSynthesisUtterance(cleanText);

  utterance.lang = "pt-BR";
  utterance.rate = 0.96;
  utterance.pitch = 0.95;
  utterance.volume = 1;

  const voices = speechSynthesis.getVoices();

  const voice = voices.find(v =>
    v.lang.toLowerCase().startsWith("pt-br")
  );

  if (voice) {
    utterance.voice = voice;
  }

  speechSynthesis.speak(utterance);
}

/* VERIFICAR SERVIDOR */
async function checkServer() {
  try {
    const response = await fetch("/api/health");

    if (!response.ok) {
      throw new Error("Servidor indisponível.");
    }

    console.log(
      "WSAZ_777 API online:",
      await response.json()
    );

  } catch (error) {
    console.warn("Não foi possível verificar o servidor.");
  }
}

/* INICIALIZAÇÃO */
loadConversations();
checkServer();
</script>
