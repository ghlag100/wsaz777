
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#17132D">
<title>WSAZ_777 | Inteligência Artificial</title>

<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  font-family: Arial, sans-serif;
  background: #100e1c;
  color: white;
  min-height: 100vh;
}

header {
  height: 72px;
  padding: 0 20px;
  display: flex;
  align-items: center;
  gap: 12px;
  border-bottom: 1px solid #302a45;
  background: #17132d;
}

.logo {
  width: 43px;
  height: 43px;
  border-radius: 14px;
  background: #7958df;
  display: grid;
  place-items: center;
  font-size: 25px;
}

.brand {
  font-weight: bold;
  font-size: 18px;
}

.subtitle {
  font-size: 11px;
  color: #aaa0c5;
  margin-top: 4px;
}

.status {
  margin-left: auto;
  color: #73e6a0;
  font-size: 12px;
}

main {
  max-width: 850px;
  margin: auto;
  padding: 30px 16px;
}

.welcome {
  text-align: center;
  padding: 35px 10px 25px;
}

.robot {
  width: 112px;
  height: 112px;
  margin: auto auto 20px;
  border-radius: 35px;
  background: linear-gradient(145deg, #7958df, #38266e);
  display: grid;
  place-items: center;
  font-size: 65px;
  box-shadow: 0 0 40px #7958df44;
}

h1 {
  font-size: 28px;
  margin-bottom: 12px;
}

.welcome p {
  color: #aaa3bd;
  line-height: 1.6;
  font-size: 14px;
}

.suggestions {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 10px;
  margin: 20px 0;
}

.suggestion {
  background: #201c31;
  color: #e6e0f5;
  border: 1px solid #38304e;
  padding: 15px;
  border-radius: 13px;
  text-align: left;
  cursor: pointer;
  font-size: 13px;
}

.suggestion:hover {
  border-color: #9475ed;
  background: #29213e;
}

#messages {
  display: flex;
  flex-direction: column;
  gap: 14px;
  padding-bottom: 20px;
}

.message {
  max-width: 88%;
  padding: 14px 16px;
  border-radius: 16px;
  line-height: 1.6;
  font-size: 14px;
  white-space: pre-wrap;
  overflow-wrap: anywhere;
}

.bot {
  align-self: flex-start;
  background: #211d32;
  border: 1px solid #38304e;
}

.user {
  align-self: flex-end;
  background: #6245bd;
}

.chatbox {
  position: sticky;
  bottom: 10px;
  background: #1c182a;
  border: 1px solid #41365c;
  border-radius: 17px;
  padding: 10px;
  display: flex;
  gap: 9px;
  box-shadow: 0 8px 30px #0008;
}

textarea {
  flex: 1;
  min-width: 0;
  background: transparent;
  border: none;
  outline: none;
  color: white;
  resize: none;
  padding: 12px 8px;
  font-family: inherit;
  font-size: 14px;
  max-height: 120px;
}

textarea::placeholder {
  color: #9189a5;
}

button.send {
  width: 46px;
  height: 46px;
  border: none;
  border-radius: 13px;
  background: #7958df;
  color: white;
  font-size: 21px;
  cursor: pointer;
}

button:disabled {
  opacity: .5;
  cursor: not-allowed;
}

.footer {
  color: #756d88;
  text-align: center;
  font-size: 11px;
  padding: 18px 0;
}

@media(max-width: 500px) {
  h1 { font-size: 24px; }
  .suggestions { grid-template-columns: 1fr; }
  main { padding: 18px 12px; }
}
</style>
</head>

<body>

<header>
  <div class="logo">🤖</div>
  <div>
    <div class="brand">WSAZ_777</div>
    <div class="subtitle">Inteligência artificial</div>
  </div>
  <div class="status">● Disponível</div>
</header>

<main>

<section class="welcome" id="welcome">
  <div class="robot">🤖</div>
  <h1>Olá! Eu sou WSAZ_777.</h1>
  <p>
    Sua inteligência artificial para ajudar em qualquer assunto.
    Pergunte, explore ideias e descubra novas possibilidades.
  </p>
</section>

<section class="suggestions" id="suggestions">
  <button class="suggestion"
    onclick="sendQuestion('Quanto é 157 vezes 28? Explique.')">
    🧮 Fazer cálculos
  </button>

  <button class="suggestion"
    onclick="sendQuestion('Me explique como funciona a inteligência artificial.')">
    🧠 Aprender algo novo
  </button>

  <button class="suggestion"
    onclick="sendQuestion('Crie um texto profissional para mim.')">
    ✍️ Criar textos
  </button>

  <button class="suggestion"
    onclick="sendQuestion('Me ajude com programação.')">
    💻 Programação
  </button>
</section>

<section id="messages"></section>

<div class="chatbox">
  <textarea
    id="question"
    rows="1"
    maxlength="2000"
    placeholder="Pergunte qualquer coisa..."
  ></textarea>

  <button class="send" id="send" onclick="sendQuestion()">
    ➤
  </button>
</div>

<div class="footer">
  WSAZ_777 • Sua IA, suas possibilidades.
</div>

</main>

<script>
const API_ENDPOINT = "/api/chat";

const question = document.getElementById("question");
const messages = document.getElementById("messages");
const sendButton = document.getElementById("send");

function addMessage(text, type) {
  const div = document.createElement("div");
  div.className = "message " + type;
  div.textContent = text;
  messages.appendChild(div);
  div.scrollIntoView({ behavior: "smooth", block: "end" });
  return div;
}

async function sendQuestion(text) {
  const message = (text || question.value).trim();

  if (!message || sendButton.disabled) return;

  document.getElementById("welcome").style.display = "none";
  document.getElementById("suggestions").style.display = "none";

  addMessage(message, "user");
  question.value = "";
  sendButton.disabled = true;

  const pending = addMessage(
    "WSAZ_777 está pensando...",
    "bot"
  );

  try {
    const response = await fetch(API_ENDPOINT, {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        message: message
      })
    });

    const data = await response.json();

    if (!response.ok) {
      throw new Error(
        data.reply || "Erro HTTP " + response.status
      );
    }

    pending.textContent =
      data.reply || "Não recebi uma resposta da IA.";

  } catch (error) {
    pending.textContent =
      "Não consegui conectar à inteligência artificial.\n\n" +
      "Detalhes: " + error.message +
      "\n\nTente novamente mais tarde.";

  } finally {
    sendButton.disabled = false;
    question.focus();
  }
}

question.addEventListener("keydown", function(event) {
  if (event.key === "Enter" && !event.shiftKey) {
    event.preventDefault();
    sendQuestion();
  }
});
</script>

</body>
</html>
